ADVISOR_MODE: normal
ALLOWED_CITIES:
- London
- New York
- Los Angeles
- Chicago
- Miami
- Denver
- Phoenix
- Seattle
- Boston
- Tokyo
- Paris
- Berlin
- Sydney
- Toronto
- Houston
- Atlanta
- Dallas
- San Francisco
- Washington
- Philadelphia
- Buenos Aires
- Ankara
# Cities on probationary hold: 0-33% WR in paper trading.
# Re-evaluate after 10+ live trades show >= 50% WR.
BLOCKED_CITIES_WEAK_PERFORMANCE:
- London
- Los Angeles
- New York
- Seattle
- San Francisco
BLOCKED_EDGE_BUCKETS: []
CITY_CONFIG:
  Berlin:
    primary_station: EDDB
    timezone: Europe/Berlin
  Boston:
    primary_station: KBOS
    timezone: America/New_York
  Chicago:
    primary_station: KORD
    timezone: America/Chicago
  Denver:
    primary_station: KDEN
    timezone: America/Denver
  London:
    primary_station: EGLL
    timezone: Europe/London
  Los Angeles:
    primary_station: KLAX
    timezone: America/Los_Angeles
  Miami:
    primary_station: KMIA
    timezone: America/New_York
  New York:
    primary_station: KJFK
    timezone: America/New_York
  Paris:
    primary_station: LFPG
    timezone: Europe/Paris
  Phoenix:
    primary_station: KPHX
    timezone: America/Phoenix
  Seattle:
    primary_station: KSEA
    timezone: America/Los_Angeles
  Seoul:
    primary_station: RKSS
    timezone: Asia/Seoul
  Sydney:
    primary_station: YSSY
    timezone: Australia/Sydney
  Tokyo:
    primary_station: RJTT
    timezone: Asia/Tokyo
  Toronto:
    primary_station: CYYZ
    timezone: America/Toronto
CONFIDENCE_THRESHOLDS:
  HIGH_CONFIDENCE_MAX_HOURS: 72
  MEDIUM_CONFIDENCE_MAX_HOURS: 168
ENGINE_NAME: weather_engine_v1
ENGINE_VERSION: 1.0.0
ENSEMBLE:
  CORRELATED_MODELS:
    GFS:
    - open_meteo_gfs
    - openweather_gfs
    - noaa_gfs
  ENABLED: true
  MIN_INDEPENDENT_SOURCES: 2
  SOURCE_TIMEOUT_SECONDS: 12
  # Ultra-strict variance gate: BSS=-0.31 proves we were trading noisy signals.
  # At 0.06 we require near-perfect ensemble agreement before entering.
  # Was 0.08; tightened after 8/13 trades hit stop-loss from overconfident signals.
  VARIANCE_THRESHOLD: 0.06
FORECAST_SOURCES:
- api_key_env: TOMORROW_IO_API_KEY
  base_url: https://api.tomorrow.io/v4
  name: tomorrow_io
  timeout_seconds: 10
- api_key_env: OPENWEATHER_API_KEY
  base_url: https://api.openweathermap.org/data/3.0
  name: openweather
  timeout_seconds: 10
- api_key_env: WEATHERAPI_KEY
  base_url: https://api.weatherapi.com/v1
  name: weatherapi
  timeout_seconds: 10
HEALTH_MONITOR_ENABLED: false
LOG_ALL_OBSERVATIONS: true
MAX_FORECAST_HORIZON_DAYS: 10
MAX_ODDS: 0.80
# MEDIUM trades haben historisch 11% Win-Rate -> effectively blocked (need 3.25x edge)
MEDIUM_CONFIDENCE_EDGE_MULTIPLIER: 3.25
MIN_CONFIDENCE: HIGH
# Raised from 0.30 to 0.40: tighter filter after 8/13 trades failed.
# Only enter when model probability is strongly diverged from market price.
MIN_EDGE: 0.40
# Raised from 0.03 to 0.10: absolute edge floor prevents false positives at extreme odds.
# A 10% absolute gap (e.g. model=65% vs market=55%) is meaningful calibration signal.
MIN_EDGE_ABSOLUTE: 0.10
# Raised from 0.35 to 0.40: avoid borderline markets where resolution variance is highest.
MIN_ENTRY_PRICE: 0.40
# Raised from 50 to 500 USD (round 3, 2026-04-16):
# Thin markets (<$500 liquidity) show larger price swings, easier stop-loss hits.
# $500 is a reasonable floor for meaningful market participation.
MIN_LIQUIDITY: 500
# Minimum YES price — unchanged at 0.15: near-zero probabilities are trap markets.
MIN_ODDS: 0.15
# Timing: focus on the 24-96h sweet spot.
# <24h: same-day noise dominates; ensemble models are still updating.
# 24-96h: best forecast accuracy window for NWP models (GFS, ECMWF).
# >96h: 4+ day forecasts are too uncertain; edge signals are unreliable noise.
MIN_TIME_TO_RESOLUTION_HOURS: 24
MAX_TIME_TO_RESOLUTION_HOURS: 96
LATE_STAGE_MAX_HOURS: 48
LATE_STAGE_EDGE_BONUS: 0.10
OBSERVATION_LOG_PATH: logs/weather_observations.jsonl
# Raised from 4.5 to 5.5°F: BSS=-0.31 proves systematic overconfidence.
# Wider sigma reduces false-precision signals and forces larger true edge gaps.
SIGMA_F: 5.5
SIGMA_HORIZON_ADJUSTMENTS:
  1: 0.8
  2: 0.9
  3: 1.0
  5: 1.2
  7: 1.5
  10: 2.0
