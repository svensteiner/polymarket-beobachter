CONFIDENCE_THRESHOLDS:
  HIGH_CONFIDENCE_MAX_HOURS: 72
  MEDIUM_CONFIDENCE_MAX_HOURS: 168
ENGINE_NAME: weather_engine_v1
ENGINE_VERSION: 1.0.0
ENSEMBLE:
  CORRELATED_MODELS:
    GFS:
    - open_meteo_gfs
    - openweather_gfs
    - noaa_gfs
    - gfs_ensemble
    # Commercial vendors largely remix GFS — keep them in the GFS cluster
    - tomorrow_io_proprietary
    - openweather_proprietary
  ECMWF:
    - ecmwf_ifs025
  ICON:
    - icon_global
  GEM:
    - gem_global
  MET_NORWAY:
    - met_norway
  ENABLED: true
  # After adding ECMWF/ICON/GEM we can require real diversity
  MIN_INDEPENDENT_SOURCES: 2
  SOURCE_TIMEOUT_SECONDS: 12
  VARIANCE_THRESHOLD: 0.06
FORECAST_SOURCES:
# Independent NWP models via Open-Meteo (no API key) — primary skill stack
- name: ecmwf_ifs
  base_url: https://api.open-meteo.com/v1
  timeout_seconds: 12
  notes: ECMWF IFS 0.25 via Open-Meteo (independent of GFS)
- name: icon_global
  base_url: https://api.open-meteo.com/v1
  timeout_seconds: 12
  notes: DWD ICON Global via Open-Meteo
- name: gem_global
  base_url: https://api.open-meteo.com/v1
  timeout_seconds: 12
  notes: CMC GEM Global via Open-Meteo
- name: open_meteo
  base_url: https://api.open-meteo.com/v1
  timeout_seconds: 12
  notes: Open-Meteo default GFS
# Commercial / optional (API keys) — treated as GFS-correlated
- api_key_env: TOMORROW_IO_API_KEY
  base_url: https://api.tomorrow.io/v4
  name: tomorrow_io
  timeout_seconds: 10
- api_key_env: OPENWEATHER_API_KEY
  base_url: https://api.openweathermap.org/data/3.0
  name: openweather
  timeout_seconds: 10
- api_key_env: WEATHERAPI_KEY
  base_url: https://api.weatherapi.com/v1
  name: weatherapi
  timeout_seconds: 10
