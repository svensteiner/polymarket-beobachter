ADVISOR_MODE: normal
ALLOWED_CITIES:
- London
- New York
- Los Angeles
- Chicago
- Miami
- Denver
- Phoenix
- Seattle
- Boston
- Tokyo
- Paris
- Berlin
- Sydney
- Toronto
- Houston
- Atlanta
- Dallas
- San Francisco
- Washington
- Philadelphia
- Buenos Aires
- Ankara
BLOCKED_EDGE_BUCKETS: []
CITY_CONFIG:
  Berlin:
    primary_station: EDDB
    timezone: Europe/Berlin
  Boston:
    primary_station: KBOS
    timezone: America/New_York
  Chicago:
    primary_station: KORD
    timezone: America/Chicago
  Denver:
    primary_station: KDEN
    timezone: America/Denver
  London:
    primary_station: EGLL
    timezone: Europe/London
  Los Angeles:
    primary_station: KLAX
    timezone: America/Los_Angeles
  Miami:
    primary_station: KMIA
    timezone: America/New_York
  New York:
    primary_station: KJFK
    timezone: America/New_York
  Paris:
    primary_station: LFPG
    timezone: Europe/Paris
  Phoenix:
    primary_station: KPHX
    timezone: America/Phoenix
  Seattle:
    primary_station: KSEA
    timezone: America/Los_Angeles
  Seoul:
    primary_station: RKSS
    timezone: Asia/Seoul
  Sydney:
    primary_station: YSSY
    timezone: Australia/Sydney
  Tokyo:
    primary_station: RJTT
    timezone: Asia/Tokyo
  Toronto:
    primary_station: CYYZ
    timezone: America/Toronto
CONFIDENCE_THRESHOLDS:
  HIGH_CONFIDENCE_MAX_HOURS: 72
  MEDIUM_CONFIDENCE_MAX_HOURS: 168
ENGINE_NAME: weather_engine_v1
ENGINE_VERSION: 1.0.0
ENSEMBLE:
  CORRELATED_MODELS:
    GFS:
    - open_meteo_gfs
    - openweather_gfs
    - noaa_gfs
  ENABLED: true
  MIN_INDEPENDENT_SOURCES: 1
  SOURCE_TIMEOUT_SECONDS: 12
  VARIANCE_THRESHOLD: 0.15
FORECAST_SOURCES:
- api_key_env: TOMORROW_IO_API_KEY
  base_url: https://api.tomorrow.io/v4
  name: tomorrow_io
  timeout_seconds: 10
- api_key_env: OPENWEATHER_API_KEY
  base_url: https://api.openweathermap.org/data/3.0
  name: openweather
  timeout_seconds: 10
- api_key_env: WEATHERAPI_KEY
  base_url: https://api.weatherapi.com/v1
  name: weatherapi
  timeout_seconds: 10
HEALTH_MONITOR_ENABLED: false
LOG_ALL_OBSERVATIONS: true
MAX_FORECAST_HORIZON_DAYS: 10
MAX_ODDS: 0.85
# MEDIUM trades haben historisch 11% Win-Rate -> geblockt durch hohen Multiplikator
MEDIUM_CONFIDENCE_EDGE_MULTIPLIER: 2.5
MIN_CONFIDENCE: HIGH
MIN_EDGE: 0.27
MIN_EDGE_ABSOLUTE: 0.03
MIN_ENTRY_PRICE: 0.35
MIN_LIQUIDITY: 10
MIN_ODDS: 0.02
# Late-stage preference: bevorzuge Maerkte <48h vor Aufloesung
MIN_TIME_TO_RESOLUTION_HOURS: 4
LATE_STAGE_MAX_HOURS: 48
LATE_STAGE_EDGE_BONUS: 0.10
OBSERVATION_LOG_PATH: logs/weather_observations.jsonl
SIGMA_F: 3.5
SIGMA_HORIZON_ADJUSTMENTS:
  1: 0.8
  2: 0.9
  3: 1.0
  5: 1.2
  7: 1.5
  10: 2.0
