BLOCKED_EDGE_BUCKETS: []
# 2026-06-10/11 no-forward-edge decision: block market types with no proven
# forward edge over the MARKET price (analytics/forward_validation.py, n=2496
# resolved markets, ~24h lead). Model-Brier vs Market-Brier per type:
#   exact        n=1346  0.1594 vs 0.1470  -> WORSE (blocked)
#   at_or_above  n=101   0.2182 vs 0.1623  -> WORSE (blocked)
#   between      n=1009  0.1557 vs 0.1416  -> WORSE (blocked 2026-06-11, large n)
#   at_or_below  n=40    0.1485 vs 0.1545  -> only type that BEATS market (kept open)
# Concentrates paper exposure on the one positive-skill type while the raw-ensemble
# (pre-shrinkage) test accumulates. Set to [] to re-enable once
# analytics/forward_validation.py reports live_eligible.
BLOCKED_MARKET_TYPES:
- exact
- at_or_above
- between
# 2026-08-30: explicit allowlist — paper lane concentrates on the only type
# with historical forward skill. Guardrails reject anything outside this list
# even if BLOCKED_MARKET_TYPES is emptied by mistake.
ALLOWED_MARKET_TYPES:
- at_or_below
# Paper trading focus mode (orchestrator / simulator / guardrails).
PAPER_LANE_MODE: at_or_below_only
# Extra Gamma pages (offset*500) scanning only at_or_below phrases.
GAMMA_BELOW_PAGES: 3
# Liquidity floor for the below-prefer discovery pass.
GAMMA_BELOW_MIN_LIQUIDITY: 50
# Arbitrage detector stays informative only — never allocates capital.
ARBITRAGE_SHADOW_ONLY: true
# Soft-block cities where model loses to market on at_or_below forward skill
# (unique markets, n >= CITY_SKILL_MIN_N). Fail-open if report missing.
CITY_SKILL_SOFT_BLOCK: true
CITY_SKILL_MIN_N: 5
